name: public-pool-bitcoin-cash
services:
  app:
    container_name: public-pool-bitcoin-cash
    image: theretromike/nodes:bitcoincash
    restart: unless-stopped
    volumes:
      - /DATA/AppData/public-pool-bitcoin-cash/data:/root/.bitcoin
    ports:
      - "7002:7002"
      - "9002:9002"
      - "8334:8334"
    command: "/usr/bin/bitcoind -printtoconsole -server -prune=550 -wallet=default -zmqpubhashblock=tcp://0.0.0.0:7002 -rpcbind=0.0.0.0 -rpcport=9002 -rpcallowip=0.0.0.0/0 -port=8334 -rpcuser=pooluser -rpcpassword=poolpassword"
x-casaos:
  architectures:
    - amd64
  main: app
  store_app_id: public-pool-bitcoin-cash
  category: Public Pool
  title:
    en_US: Bitcoin Cash (BCH) Node
  tagline:
    en_US: Bitcoin Cash pruned node for Public Pool.
  description:
    en_US: Bitcoin Cash node with RPC and ZMQ enabled.
  developer: Public Pool
  author: Public Pool
  icon: https://raw.githubusercontent.com/Sert1985n/public-pool-store-clean/main/Apps/bitcoin-cash/icon.png
  port_map: "9002"
