name: public-pool-neurai
services:
  app:
    container_name: public-pool-neurai
    image: theretromike/nodes:neurai
    restart: unless-stopped
    volumes:
      - /DATA/AppData/public-pool-neurai/data:/root/.neurai
    ports:
      - "7011:7011"
      - "9011:9011"
    command:
      - /usr/bin/neuraid
      - -printtoconsole
      - -server
      - -prune=550
      - -wallet=default
      - -zmqpubhashblock=tcp://0.0.0.0:7011
      - -rpcbind=0.0.0.0
      - -rpcport=9011
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=pooluser
      - -rpcpassword=poolpassword
x-casaos:
  architectures:
    - amd64
  main: app
  store_app_id: public-pool-neurai
  category: Public Pool
  title:
    en_US: NeurAI (XNA) Node
  tagline:
    en_US: Neurai pruned node for Public Pool.
  description:
    en_US: Neurai daemon node with RPC and ZMQ enabled.
  developer: Public Pool
  author: Public Pool
  icon: https://raw.githubusercontent.com/Sert1985n/public-pool-store-clean/main/Apps/neurai/icon.png
  port_map: "9011"
