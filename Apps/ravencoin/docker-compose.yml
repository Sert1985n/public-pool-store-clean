name: public-pool-ravencoin
services:
  app:
    container_name: public-pool-ravencoin
    image: theretromike/nodes:ravencoin
    restart: unless-stopped
    volumes:
      - /DATA/AppData/public-pool-ravencoin/data:/root/.raven
    ports:
      - "7010:7010"
      - "9010:9010"
    command: "/usr/bin/ravend -printtoconsole -server -prune=550 -wallet=default -zmqpubhashblock=tcp://0.0.0.0:7010 -rpcbind=0.0.0.0 -rpcport=9010 -rpcallowip=0.0.0.0/0 -rpcuser=pooluser -rpcpassword=poolpassword"
x-casaos:
  architectures:
    - amd64
  main: app
  store_app_id: public-pool-ravencoin
  category: Public Pool
  title:
    en_US: Ravencoin (RVN) Node
  tagline:
    en_US: Ravencoin node for Public Pool.
  description:
    en_US: Ravencoin node with RPC and ZMQ enabled.
  developer: Public Pool
  author: Public Pool
  icon: https://raw.githubusercontent.com/Sert1985n/public-pool-store-clean/main/Apps/ravencoin/icon.png
  port_map: "9010"
