name: public-pool-bitcoin-cash-ii
services:
  app:
    container_name: public-pool-bitcoin-cash-ii
    image: theretromike/nodes:bitcoincashii
    restart: unless-stopped
    volumes:
      - /DATA/AppData/public-pool-bitcoin-cash-ii/data:/data
    ports:
      - "7116:7016"
      - "9116:9016"
    entrypoint: /bin/sh
    command: >
      -lc '
      set -e;
      BIN="";
      for x in /usr/bin/bitcoind /usr/local/bin/bitcoind; do
        [ -x "$x" ] && BIN="$x" && break;
      done;
      [ -n "$BIN" ] || { echo "BCH2 daemon not found"; exit 1; };
      exec "$BIN" -datadir=/data -printtoconsole -server=1 -prune=550 -rpcbind=0.0.0.0 -rpcallowip=0.0.0.0/0 -rpcport=9016 -rpcuser=pooluser -rpcpassword=poolpassword -zmqpubhashblock=tcp://0.0.0.0:7016
      '
x-casaos:
  architectures:
    - amd64
  main: app
  store_app_id: public-pool-bitcoin-cash-ii
  category: Public Pool Coins
  title:
    en_US: Bitcoin Cash II (BCH2) Node
  tagline:
    en_US: Bitcoin Cash II pruned node for Public Pool.
  description:
    en_US: Bitcoin Cash II daemon node with RPC and ZMQ enabled.
  developer: Public Pool
  author: Public Pool
  icon: https://raw.githubusercontent.com/Sert1985n/public-pool-store-clean/main/Apps/bitcoin-cash-ii/icon.png
  port_map: "9116"
