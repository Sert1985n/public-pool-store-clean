name: public-pool-ethereum-classic
services:
  app:
    container_name: public-pool-ethereum-classic
    image: local/ethereum-classic:latest
    restart: unless-stopped
    volumes:
      - /DATA/AppData/public-pool-ethereum-classic/data:/root/.ethereum-classic
    ports:
      - "9032:9032"
      - "8551:8551"
      - "30303:30303"
x-casaos:
  architectures:
    - amd64
  main: app
  store_app_id: public-pool-ethereum-classic
  category: Public Pool
  title:
    en_US: Ethereum Classic (ETC) Node
  tagline:
    en_US: Ethereum Classic node for Public Pool.
  description:
    en_US: Ethereum Classic node for Public Pool.
  developer: Public Pool
  author: Public Pool
  icon: https://raw.githubusercontent.com/Sert1985n/public-pool-store-clean/main/Apps/ethereum-classic/icon.png
  port_map: "9032"
