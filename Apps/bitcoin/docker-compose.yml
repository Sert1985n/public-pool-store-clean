name: public-pool-bitcoin

services:
  app:
    container_name: public-pool-bitcoin
    image: theretromike/nodes:bitcoin
    restart: unless-stopped
    volumes:
      - /DATA/AppData/public-pool-bitcoin/data:/root/.bitcoin
    ports:
      - "7004:7004"
      - "9004:9004"
      - "8333:8333"
    environment:
      TZ: ${TZ}
      RPC_USER: ${RPC_USER:-pooluser}
      RPC_PASSWORD: ${RPC_PASSWORD:-poolpassword}
    command: >
      /bin/sh -lc '
      mkdir -p /root/.bitcoin;
      if [ ! -f /root/.bitcoin/bitcoin.conf ]; then
        cat > /root/.bitcoin/bitcoin.conf <<EOF
      server=1
      prune=550
      wallet=default
      rpcbind=0.0.0.0
      rpcallowip=0.0.0.0/0
      rpcport=9004
      rpcuser=${RPC_USER:-pooluser}
      rpcpassword=${RPC_PASSWORD:-poolpassword}
      port=8333
      zmqpubhashblock=tcp://0.0.0.0:7004
      EOF
      fi;
      exec /usr/bin/bitcoind -printtoconsole -conf=/root/.bitcoin/bitcoin.conf
      '
    x-casaos:
      volumes:
        - container: /root/.bitcoin
          description:
            en_US: Bitcoin blockchain and wallet data.
      ports:
        - container: "7004"
          description:
            en_US: ZMQ block notification port.
        - container: "9004"
          description:
            en_US: Bitcoin RPC port.
        - container: "8333"
          description:
            en_US: Bitcoin P2P port.

x-casaos:
  architectures:
    - amd64
  main: app
  store_app_id: public-pool-bitcoin
  category: Public Pool Coins
  title:
    en_US: Bitcoin (BTC) Node
  tagline:
    en_US: Bitcoin pruned node for Public Pool.
  description:
    en_US: Bitcoin daemon node for Public Pool mining stack. Runs in pruned mode with RPC and ZMQ enabled.
  developer: Public Pool
  author: Public Pool
  icon: https://raw.githubusercontent.com/Sert1985n/public-pool-store-clean/main/Apps/bitcoin/icon.png
  port_map: "9004"
