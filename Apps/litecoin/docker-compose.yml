name: public-pool-litecoin
services:
  app:
    container_name: public-pool-litecoin
    image: theretromike/nodes:litecoin
    restart: unless-stopped
    volumes:
      - /DATA/AppData/public-pool-litecoin/data:/root/.litecoin
    ports:
      - "7020:7020"
      - "9020:9020"
      - "9333:9333"
    command: "/usr/bin/litecoind -printtoconsole -server -prune=550 -wallet=default -zmqpubhashblock=tcp://0.0.0.0:7020 -rpcbind=0.0.0.0 -rpcport=9020 -rpcallowip=0.0.0.0/0 -port=9333 -rpcuser=pooluser -rpcpassword=poolpassword"
x-casaos:
  architectures:
    - amd64
  main: app
  store_app_id: public-pool-litecoin
  category: Public Pool
  title:
    en_US: Litecoin (LTC) Node
  tagline:
    en_US: Litecoin pruned node for Public Pool.
  description:
    en_US: Litecoin node with RPC and ZMQ enabled.
  developer: Public Pool
  author: Public Pool
  icon: https://raw.githubusercontent.com/Sert1985n/public-pool-store-clean/main/Apps/litecoin/icon.png
  port_map: "9020"
